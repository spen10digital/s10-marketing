name: deploy-infra

# Manual only. The GitHub environment (dev/prod) must require the owner's approval,
# and its deploy role trusts only that environment (infra/lib/cicd-stack.ts).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-infra-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # @spen10digital/s10-ui is a private GitHub Packages package. pnpm 10 ignores a project .npmrc token, so the
      # token goes in pnpm's user config (a classic token with read:packages, repo secret NPM_TOKEN).
      - run: pnpm config set "//npm.pkg.github.com/:_authToken" "$NPM_TOKEN" --location=user
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --project infra
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - name: cdk deploy
        working-directory: infra
        run: >-
          pnpm exec cdk deploy --all --require-approval never
          --context env=${{ inputs.environment }}
          --context alertEmail=${{ vars.OPS_ALERT_EMAIL }}
