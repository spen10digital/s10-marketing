name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: s10_marketing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      # Superuser for migrations/test setup; the tests themselves connect as app_rw.
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/s10_marketing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # @spen10digital/s10-ui is a private GitHub Packages package. pnpm 10 ignores a project .npmrc token, so the
      # token goes in pnpm's user config (a classic token with read:packages, repo secret NPM_TOKEN).
      - run: pnpm config set "//npm.pkg.github.com/:_authToken" "$NPM_TOKEN" --location=user
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:db
      - run: pnpm infra:synth
      - name: Playwright smoke
        run: |
          pnpm --filter @s10/web exec playwright install --with-deps chromium
          pnpm test:e2e

  # cdk diff against the dev account through GitHub OIDC (no stored keys).
  # Runs only after the owner has deployed the Cicd stack and set the repo variable.
  cdk-diff:
    if: github.event_name == 'pull_request' && vars.AWS_DEV_DIFF_ROLE_ARN != ''
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # @spen10digital/s10-ui is a private GitHub Packages package. pnpm 10 ignores a project .npmrc token, so the
      # token goes in pnpm's user config (a classic token with read:packages, repo secret NPM_TOKEN).
      - run: pnpm config set "//npm.pkg.github.com/:_authToken" "$NPM_TOKEN" --location=user
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_DIFF_ROLE_ARN }}
          aws-region: us-east-2
      - run: pnpm infra:diff --context alertEmail=${{ vars.OPS_ALERT_EMAIL }}
